[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgkit"
version = "0.1.0"
description = "Pan-gene family analysis toolkit based on OrthoFinder output"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "biopython>=1.79",
]

[project.scripts]
pgkit = "pgkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgkit = ["scripts/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
